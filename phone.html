<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0e1917"><title>Scoreboard remote</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e1917;color:#edf6f0;font:16px -apple-system,BlinkMacSystemFont,"Inter",sans-serif}main{max-width:560px;margin:auto;padding:24px 18px 48px}h1{font-size:30px;margin:0 0 17px;letter-spacing:-1px}h2{font-size:19px;margin:24px 0 12px}button,input,select{font:inherit;color:inherit}button,select,input[type=text],input[type=number]{min-height:45px;padding:8px 11px;border-radius:9px;border:1px solid #486259;background:#20332c}button{cursor:pointer}button[aria-pressed=true],button.primary{background:#c0ee9a;color:#132310;border-color:#c0ee9a}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e9ffc7}nav,.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}nav{margin-bottom:20px}nav button{flex:1;white-space:nowrap}.box{border:1px solid #354d43;border-radius:14px;background:#162820;padding:14px;margin:10px 0}.box strong{font-size:18px}.muted,small{color:#b8cec0}p{line-height:1.45;margin:9px 0}.panel{display:block;width:100%;background:black;image-rendering:pixelated;border:10px solid #29382e;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid select,.grid input{width:100%}label{display:block;margin:12px 0 6px}select,input[type=text],input[type=number]{width:100%}input[type=range]{width:100%;accent-color:#bbef9a}#net{color:#b5e5ce}button:disabled{opacity:.65}.game{padding:13px 0;border-bottom:1px solid #395345}.game strong{display:block;line-height:1.4;overflow-wrap:anywhere}.box p{overflow-wrap:anywhere}.game button{margin:3px 5px 2px 0}output{color:#c8eea4}[hidden]{display:none!important}
</style><main><h1>Scoreboard remote</h1><nav aria-label="Remote screens"><button data-tab="now">Now showing</button><button data-tab="games">Games</button><button data-tab="settings">Settings</button></nav>
<section id="now"><img class="panel" id="panel" src="/panel.png" alt="Current LED panel"><div class="box"><strong id="match">Connecting to Pi…</strong><p id="detail"></p><p id="situations" class="muted"></p><small id="status"></small></div><button id="browse" class="primary">Choose a game</button> <button id="release" hidden>Unpin game</button>
<div id="manual" hidden><h2>Manual score</h2><div class="grid"><label>Home / red<input id="a" type="text" maxlength="32"></label><label>Score<input id="x" type="text" maxlength="32"></label><label>Away / blue<input id="b" type="text" maxlength="32"></label><label>Score<input id="y" type="text" maxlength="32"></label></div><label>Period, innings or result<input id="phase" type="text" maxlength="32"></label><button id="apply">Update panel</button></div></section>
<section id="games" hidden><div class="grid"><label>Channel<select id="sport"></select></label><label>Source<select id="mode"><option>Feed</option><option>Demo</option><option>Manual</option></select></label></div><h2>Games on this channel</h2><small>Choose a team’s star to save a favourite.</small><div id="list"></div></section>
<section id="settings" hidden><h2>Display</h2><label>Brightness · <output id="bv"></output>%<input id="brightness" type="range" min="1" max="100"></label><label>TV delay · <output id="dv"></output> seconds<input id="delay" type="range" min="0" max="120"></label><small>The delay applies to scores, game details and celebrations.</small>
<label><input id="night" type="checkbox"> Dim the panel at night</label><div id="nightFields"><div class="grid"><label>From<select id="nightStart"></select></label><label>Until<select id="nightEnd"></select></label></div><label>Night brightness · <output id="nv"></output>%<input id="nightBrightness" type="range" min="1" max="100"></label><small>Uses the Pi’s local time.</small></div><h2>Connection</h2><div class="box"><p id="net"></p><p id="feed"></p><small id="effective"></small></div></section><p id="notice" role="status"></p></main>
<script>
const $=id=>document.getElementById(id);let state,guide,token,tab='now',pending=false,lastList='',lastManual='',seq=0;
function page(key){tab=key;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===key));for(const t of ['now','games','settings'])$(t).hidden=t!==key}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>page(b.dataset.tab));$('browse').onclick=()=>page('games');page('now');
for(const id of ['nightStart','nightEnd'])for(let h=0;h<24;h++)$(id).add(new Option(String(h).padStart(2,'0')+':00',h));
function el(tag,text){const v=document.createElement(tag);v.textContent=text;return v}
function fav(t){return state.sport+'|'+t}
function games(){const signature=JSON.stringify([state.sport,state.mode,state.pin,state.favourites,guide.games]);if(signature===lastList)return;lastList=signature;
const list=$('list');list.replaceChildren();const items=[...guide.games];const starred=g=>g.teams.some(t=>state.favourites.includes(fav(t)));
items.sort((a,b)=>Number(starred(b))-Number(starred(a))||Number(b.live)-Number(a.live));
if(!items.length){list.append(el('p',state.mode==='Manual'?'Enter the score on Now showing.':guide.health==='Connecting'?'Loading fixtures…':'No games listed by this feed.'));return}
for(const g of items){const card=el('div','');card.className='game';card.append(el('strong',g.teams.join(' vs ')),el('p',[g.phase,g.detail].filter(Boolean).join(' · ')));const watch=el('button',state.pin===g.id?'Watching':'Watch this game');watch.className='primary';watch.onclick=async()=>{if(await save({pin:g.id}))page('now')};card.append(watch);
for(const t of new Set(g.teams)){const k=fav(t),on=state.favourites.includes(k),b=el('button',(on?'★ ':'☆ ')+t);b.setAttribute('aria-pressed',on);b.onclick=()=>save({favourites:on?state.favourites.filter(x=>x!==k):[...state.favourites,k]});card.append(b)}list.append(card)}}
function paint(data){state=data.state;guide=data.guide;token=data.token;if(!$('sport').options.length)for(const c of data.channels)$('sport').add(new Option(c,c));for(const id of ['sport','mode','delay','brightness','nightStart','nightEnd','nightBrightness'])if(document.activeElement!==$(id))$(id).value=state[id];$('night').checked=state.night;$('nightFields').hidden=!state.night;
for(const [key,label] of [['brightness','bv'],['delay','dv'],['nightBrightness','nv']])$(label).textContent=$(key).value;
$('manual').hidden=state.mode!=='Manual';const m=JSON.stringify([state.names,state.scores,state.phase]);if(m!==lastManual){lastManual=m;[$('a').value,$('b').value]=state.names;[$('x').value,$('y').value]=state.scores;$('phase').value=state.phase}
const g=guide.games.find(v=>v.id===(state.pin||guide.showing));$('match').textContent=g?g.teams.join(' vs '):state.sport;$('detail').textContent=g?[g.phase,g.detail].filter(Boolean).join(' · '):state.mode;$('situations').textContent=g&&g.display?(g.display.pages||[]).join(' · '):'';$('release').hidden=!state.pin;$('status').textContent=data.status;$('net').textContent='Pi connected · local Wi-Fi';const when=guide.checked?new Date(guide.checked*1000).toLocaleTimeString():'';$('feed').textContent='Sports feed · '+guide.health+(when?' · last data '+when:'');$('effective').textContent='Panel brightness '+data.actualBrightness+'%';games()}
async function get(){const r=await fetch('/api',{cache:'no-store'});if(!r.ok)throw Error();return r.json()}
async function save(patch){if(pending||!token)return false;pending=true;seq++;try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','X-Board-Key':token},body:JSON.stringify(patch)});if(!r.ok)throw Error();paint(await get());$('notice').textContent='';return true}catch{$('notice').textContent='Change could not be confirmed. Check the Pi connection.';return false}finally{pending=false}}
$('release').onclick=()=>save({pin:''});$('apply').onclick=()=>save({names:[$('a').value,$('b').value],scores:[$('x').value,$('y').value],phase:$('phase').value});
for(const k of ['sport','mode','delay','brightness','nightStart','nightEnd','nightBrightness','night'])$(k).onchange=()=>save({[k]:k==='night'?$(k).checked:['sport','mode'].includes(k)?$(k).value:Number($(k).value)});
for(const [k,o] of [['delay','dv'],['brightness','bv'],['nightBrightness','nv']])$(k).oninput=()=>$(o).textContent=$(k).value;
async function poll(){const rev=seq;try{const data=await get();if(!pending&&rev===seq)paint(data);if(tab==='now')$('panel').src='/panel.png?t='+Date.now()}catch{$('net').textContent='Pi disconnected · reconnecting';$('status').textContent='Pi disconnected · showing last preview'}finally{setTimeout(poll,1500)}}poll()
</script></html>
