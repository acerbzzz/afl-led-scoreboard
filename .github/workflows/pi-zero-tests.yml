name: Pi Zero AFL Scoreboard tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/pi_zero_legacy.py'
      - 'tests/test_pi_zero_legacy.py'
      - 'logos/**'
      - 'requirements.txt'
      - '.github/workflows/pi-zero-tests.yml'
  pull_request:
    paths:
      - 'scripts/pi_zero_legacy.py'
      - 'tests/test_pi_zero_legacy.py'
      - 'logos/**'
      - 'requirements.txt'
      - '.github/workflows/pi-zero-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pi-zero-legacy-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image renderer
        run: python -m pip install -r requirements.txt
      - name: Run legacy Pi Zero simulator and event tests
        run: python -m unittest discover -s tests -p 'test_pi_zero_legacy.py' -v
